name: GlasyTech Daily Cloud Send

on:
  schedule:
    - cron: "02:00 UTC / 05:00 EAT? No, need exact"
  # Actually: 09:05 EAT = 06:05 UTC
    - cron: "5 6 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render /send
        run: |
          curl -s -X POST https://glasytech-leads-bot.onrender.com/send \
            -H "Content-Type: application/json" \
            -H "x-send-token: glasytech-send-2026" \
            -d '{"text":"GlasyTech Daily Leads"}' \
            | tee /tmp/cloud-send.json
          echo "::notice::Cloud send result saved to /tmp/cloud-send.json"
